<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Última Xícara</title>
    <link rel="icon" href="./images/icon.png">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <img src="./images/logo.png" alt="Logo Última Xícara">
        <nav>
            <a href="index.html">Home</a>
            <a href="sobre-nos.html">Sobre</a>
            <a href="contatos.html" class="active">Contato</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Entre em contato com a Última Xícara</h1>
        </section>

        <section class="content">
            <div class="contato-grid">
                <div>
                    <h2>Envie sua mensagem</h2>
                    <form>
                        <label for="femail">Seu e-mail</label>
                        <input type="email" id="femail" name="femail" required>
                        <label for="lassunto">Assunto</label>
                        <input type="text" id="lassunto" name="lassunto" required>
                        <label for="mensagem">Descrição</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                        <button type="submit" class="btn">Enviar</button>
                    </form>
                </div>

                <div>
                    <h2>Outros canais</h2>
                    <p><strong>E-mail:</strong> contato@ultimaxicara.com.br</p>
                    <p><strong>Telefone:</strong> (12) 1234-5678</p>
                    <p><strong>Endereço:</strong> Rua do Café, 123 — Centro</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Última Xícara</p>
    </footer>

</body>

</html>
